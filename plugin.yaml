name: vibeleak-atlas
version: "0.2.0"
description: "Owner-approved website assessments, private evidence, fix-plan drafts and comparable rescans."
author: VibeLeak
license: MIT
homepage: https://github.com/abundantbeing/hermes-vibeleak-atlas
manifest_version: 1
kind: standalone
requires_hermes: ">=0.22.6"
provides_tools: []
provides_hooks: []
requires_env: []
optional_env:
  - name: VIBELEAK_ATLAS_API_KEY
    description: Owner key for explicitly approved scans and locally initiated private results. Requires scan:write, scan:read and findings:read.
    password: true
    url: https://www.vibeleak.app/dashboard/api-keys
config_schema:
  api_key:
    type: secret
    env: VIBELEAK_ATLAS_API_KEY
    label: VibeLeak owner API key
    description: Scoped to scan:write, scan:read and findings:read. Used only for website assessments you approve.
